schema_version: 1.0.0
id: MOD-COMPOUND-DECOMPOSITION
version: 0.1.0
status: experimental
kind: core
title: Compound feature decomposition
summary: Decomposes multi-part features into required components and verifies component interactions before
  completion.
gate_coverage:
- HG-CF
phase_coverage:
- G
selection:
  policy: any_active_gate
  priority: 10
  dependencies:
  - MOD-SYSTEM-MAPS
  conflicts: []
contract:
  inputs:
    required_context_fields:
    - mode
    artifact_classes:
    - repository
    - requirements
    - feature_inventory
    - system_map
  outputs:
  - id: module_decision
    required: true
    description: Decision-bearing module result with gate trace and evidence references.
  - id: component_matrix
    required: true
    description: Required component inventory with evidence-backed present, absent, or unknown states.
  - id: interaction_matrix
    required: true
    description: Interaction and handoff checks across the components of each compound feature.
  evidence:
    required_kinds:
    - document
    - code
    - configuration
    - test
    minimum_sources: 1
    freshness_required: true
  failure:
    on_missing_input: block
    on_tool_denied: block
    produces_unknown: true
  provenance:
    claims_required: true
    sources_required: true
    legacy_refs:
    - VHEATM-v16.1.1.skill::references/12-compound-feature-decomp.md#The Decomposition Protocol
  runtime:
    tool_classes:
    - read
    sandbox_required: false
    network_required: false
  disclosure:
    router_summary: Decompose compound features, verify every required component, and test their interactions.
    instruction_path: instructions.md
    instruction_sha256: d4828a28e266aa2de0df2a432eae7b76fb2453c5e5117f4f51641a1ebc27401f
    token_budget: 1024
