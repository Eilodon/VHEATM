schema_version: 1.0.0
id: MOD-HYBRID-VERIFICATION
version: 0.1.0
status: experimental
kind: specialist
title: Hybrid verification
summary: Reconciles static confidence with targeted dynamic confirmation for mandatory findings without
  allowing optional triage to substitute for direct proof.
gate_coverage:
- HG-HV
phase_coverage:
- E
selection:
  policy: any_active_gate
  priority: 30
  dependencies:
  - MOD-EVIDENCE-ANCHORS
  conflicts: []
contract:
  inputs:
    required_context_fields:
    - mandatory_findings
    - mode
    artifact_classes:
    - finding_register
    - evidence_matrix
    - repository
    - test_results
  outputs:
  - id: module_decision
    required: true
    description: Decision-bearing module result with gate trace and evidence references.
    schema_ref: https://vheatm.dev/schemas/module-decision.schema.json
    cardinality: one
    required_when: always
  - id: hybrid_verification_records
    required: true
    description: Static confidence, dynamic confirmation, reconciliation, and unavailable-tool disposition
      for each mandatory finding.
    schema_ref: https://vheatm.dev/schemas/module-artifact.schema.json
    cardinality: one
    required_when: completed
  evidence:
    required_kinds:
    - code
    - test
    - runtime
    minimum_sources: 1
    freshness_required: true
  failure:
    on_missing_input: block
    on_tool_denied: manual
    produces_unknown: true
  provenance:
    claims_required: true
    sources_required: true
    legacy_refs:
    - VHEATM-v16.1.1.skill::references/17-hybrid-verification.md#When [E.HV] Applies
    - VHEATM-v16.1.1.skill::references/17-hybrid-verification.md#Step 1 — Static Confidence Rating
    - VHEATM-v16.1.1.skill::references/17-hybrid-verification.md#Step 2 — Dynamic Confirmation
    - VHEATM-v16.1.1.skill::references/17-hybrid-verification.md#Verify-Before-Claim (companion rule —
      from ABG Guard 3)
  runtime:
    tool_classes:
    - read
    - execute
    sandbox_required: true
    network_required: false
  disclosure:
    router_summary: Reconcile static confidence with targeted dynamic confirmation for every mandatory
      finding; skipped execution remains unknown.
    instruction_path: instructions.md
    instruction_sha256: 369b6049d435ab412bb3fa5696feb37218bcd72d6aa2d487e870112950a4ec0e
    token_budget: 512
