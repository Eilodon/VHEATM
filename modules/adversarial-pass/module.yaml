schema_version: 1.0.0
id: MOD-ADVERSARIAL-PASS
version: 0.1.0
status: experimental
kind: specialist
title: Independent adversarial pass
summary: Challenges the audit from independent technical and organizational perspectives and reopens the
  cycle when high-impact counter-evidence survives.
gate_coverage:
- HG-AP
phase_coverage:
- M
selection:
  policy: any_active_gate
  priority: 100
  dependencies:
  - MOD-FIX-VERIFICATION
  conflicts: []
contract:
  inputs:
    required_context_fields:
    - context_mode
    - mode
    artifact_classes:
    - finding_register
    - architecture_decision_records
    - fix_verification_records
    - evidence_matrix
    - unknown_register
  outputs:
  - id: module_decision
    required: true
    description: Decision-bearing module result with gate trace and evidence references.
    schema_ref: https://vheatm.dev/schemas/module-decision.schema.json
    cardinality: one
    required_when: always
  - id: adversarial_challenge_set
    required: true
    description: Independent counter-hypotheses, evidence disposition, and cycle-reopen decisions across
      required perspectives.
    schema_ref: https://vheatm.dev/schemas/module-artifact.schema.json
    cardinality: one
    required_when: completed
  evidence:
    required_kinds:
    - document
    - code
    - test
    - runtime
    minimum_sources: 1
    freshness_required: true
  failure:
    on_missing_input: block
    on_tool_denied: block
    produces_unknown: true
  provenance:
    claims_required: true
    sources_required: true
    legacy_refs:
    - VHEATM-v16.1.1.skill::references/10-adversarial-pass.md#Protocol — Standard Mode (4 Lenses, unchanged
      from 9.0)
    - VHEATM-v16.1.1.skill::references/10-adversarial-pass.md#🆕 Protocol — Full Mode (Independent Generation
      Protocol, 4+1 Perspectives) — v13.0
    - VHEATM-v16.1.1.skill::references/10-adversarial-pass.md#Acceptance Criteria (updated)
    - VHEATM-v16.1.1.skill::references/10-adversarial-pass.md#When [M.AP] REOPENS the Cycle (unchanged)
  runtime:
    tool_classes:
    - read
    sandbox_required: false
    network_required: false
  disclosure:
    router_summary: Independently challenge findings, decisions, fixes, and unknowns; surviving high-impact
      counter-evidence reopens the cycle.
    instruction_path: instructions.md
    instruction_sha256: 7e89d521fbf88a1d63b03fb6cb4a8d95dcc768155f09fc05d05c0d047d48fa32
    token_budget: 512
