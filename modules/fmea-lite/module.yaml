schema_version: 1.0.0
id: MOD-FMEA-LITE
version: 0.1.0
status: experimental
kind: specialist
title: FMEA-lite failure ledger
summary: Enumerates triggered failure modes, causes, local and system effects, and calibrated risk priority
  before hypotheses are finalized.
gate_coverage:
- HG-FL
phase_coverage:
- G
selection:
  policy: any_active_gate
  priority: 25
  dependencies:
  - MOD-UTILITY-TREE
  - MOD-HYPOTHESIS-GENERATION
  conflicts: []
contract:
  inputs:
    required_context_fields:
    - mode
    - blast_radius
    - safety_critical
    artifact_classes:
    - utility_tree
    - system_map
    - hypothesis_register
  outputs:
  - id: module_decision
    required: true
    description: Decision-bearing module result with gate trace and evidence references.
  - id: fmea_ledger
    required: true
    description: Triggered six-field failure ledger with RPN components, disposition, and linked hypotheses.
  evidence:
    required_kinds:
    - document
    - code
    - runtime
    minimum_sources: 1
    freshness_required: true
  failure:
    on_missing_input: block
    on_tool_denied: block
    produces_unknown: true
  provenance:
    claims_required: true
    sources_required: true
    legacy_refs:
    - VHEATM-v16.1.1.skill::references/24-fmea-lite.md#Trigger Conditions
    - VHEATM-v16.1.1.skill::references/24-fmea-lite.md#6-Field FMEA-lite Format
    - VHEATM-v16.1.1.skill::references/24-fmea-lite.md#FMEA-lite Execution Protocol
  runtime:
    tool_classes:
    - read
    sandbox_required: false
    network_required: false
  disclosure:
    router_summary: Create a six-field FMEA-lite ledger and seed every material failure mode into the
      hypothesis register.
    instruction_path: instructions.md
    instruction_sha256: 258fa4d0dc0a2d24babd9bbfeae1d60077b67687b2fb52ad0a2b6d24a54720fc
    token_budget: 80
