schema_version: 1.0.0
id: MOD-PATTERN-GLOBALIZATION
version: 0.1.0
status: experimental
kind: core
title: Pattern globalization
summary: Searches every confirmed pattern across the applicable repository and records cascade decisions.
gate_coverage:
- HG-PG
phase_coverage:
- G
selection:
  policy: any_active_gate
  priority: 30
  dependencies:
  - MOD-HYPOTHESIS-GENERATION
  conflicts: []
contract:
  inputs:
    required_context_fields:
    - mode
    artifact_classes:
    - repository
    - confirmed_findings
    - hypothesis_register
    - bug_class_catalog
  outputs:
  - id: module_decision
    required: true
    description: Decision-bearing module result with gate trace and evidence references.
  - id: pattern_search_record
    required: true
    description: Per-pattern signature, scope, method, matches, exclusions, and search evidence.
  - id: cascade_decision
    required: true
    description: Decision for each additional instance and any divergent implementation discovered.
  evidence:
    required_kinds:
    - code
    - search_result
    - structural_analysis
    - historical_record
    minimum_sources: 1
    freshness_required: true
  failure:
    on_missing_input: block
    on_tool_denied: block
    produces_unknown: true
  provenance:
    claims_required: true
    sources_required: true
    legacy_refs:
    - VHEATM-v16.1.1.skill::references/08-pattern-globalization.md#Protocol — Required Steps
    - VHEATM-v16.1.1.skill::references/13-bug-class-catalog.md#Replay Protocol
    - VHEATM-v16.1.1.skill::references/19-language-profiles.md#How to Use
  runtime:
    tool_classes:
    - read
    sandbox_required: false
    network_required: false
  disclosure:
    router_summary: Globalize confirmed patterns with structural searches, documented scope, and cascade
      decisions.
    instruction_path: instructions.md
    instruction_sha256: 10a218a198f3a11c2914388297ba8ea4185dad3d1f172d05b2e1fa2e063bf727
    token_budget: 1024
