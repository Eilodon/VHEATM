schema_version: 1.0.0
id: MOD-EVIDENCE-ANCHORS
version: 0.1.0
status: experimental
kind: core
title: Evidence anchors and claim disposition
summary: Binds high-priority hypotheses and mandatory claims to direct evidence or an explicit unknown
  disposition.
gate_coverage:
- HG-E
phase_coverage:
- E
selection:
  policy: any_active_gate
  priority: 10
  dependencies:
  - MOD-PATTERN-GLOBALIZATION
  conflicts: []
contract:
  inputs:
    required_context_fields:
    - mandatory_findings
    - mode
    artifact_classes:
    - repository
    - hypothesis_register
    - pattern_search_record
    - test_results
    - source_records
  outputs:
  - id: module_decision
    required: true
    description: Decision-bearing module result with gate trace and evidence references.
    schema_ref: https://vheatm.dev/schemas/module-decision.schema.json
    cardinality: one
    required_when: always
  - id: evidence_matrix
    required: true
    description: Hypothesis and claim matrix linking sources, verification method, freshness, and result.
    schema_ref: https://vheatm.dev/schemas/module-artifact.schema.json
    cardinality: one
    required_when: completed
  - id: claim_disposition
    required: true
    description: Confirmed, contradicted, unavailable, or unknown disposition for each required claim.
    schema_ref: https://vheatm.dev/schemas/module-artifact.schema.json
    cardinality: one
    required_when: completed
  evidence:
    required_kinds:
    - code
    - test
    - log
    - configuration
    - document
    - claim_record
    minimum_sources: 1
    freshness_required: true
  failure:
    on_missing_input: block
    on_tool_denied: block
    produces_unknown: true
  provenance:
    claims_required: true
    sources_required: true
    legacy_refs:
    - VHEATM-v16.1.1.skill::references/01-phase-guide.md#[E] Experiment (updated v11.0)
    - VHEATM-v16.1.1.skill::references/17-hybrid-verification.md#Step 1 — Static Confidence Rating
    - 'VHEATM-v16.1.1.skill::references/04-automation-bias-guard.md#Guard 3: Confidence Calibration +
      Verify-Before-Claim'
  runtime:
    tool_classes:
    - read
    sandbox_required: false
    network_required: false
  disclosure:
    router_summary: Bind required hypotheses and claims to direct evidence, verification results, or explicit
      unknowns.
    instruction_path: instructions.md
    instruction_sha256: 2a4aa43ea5c1858e649e863a0cde064713dc26d0ed5fa6440ebf06052cde2ada
    token_budget: 1024
