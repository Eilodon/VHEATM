name: Apply P3-B structural probe patch

on:
  push:
    branches:
      - feat/v17-p3b-python-structural-probe
    paths:
      - .github/p3b.patch.gz.b64.part-*
      - .github/workflows/apply-p3b-probe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v17-p3b-python-structural-probe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct validated patch
        run: |
          cat .github/p3b.patch.gz.b64.part-* | base64 --decode | gzip --decompress > /tmp/p3b.patch
          echo "f547e11812780a0bc886c1a5a69d107ef9fdd315718ed04e0b84ee8c4550a18c  /tmp/p3b.patch" | sha256sum --check -
          git apply --check /tmp/p3b.patch
          git apply /tmp/p3b.patch
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate structural probe
        run: |
          python -m compileall -q src
          pytest -q tests/test_structural_probe.py
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/structural-probe.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          PY
      - name: Commit structural probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/structural-probes.md pyproject.toml schemas/structural-probe.schema.json src/vheatm_control/structural_probe.py tests/test_structural_probe.py
          git commit -m "feat: add read-only Python structural probe"
          git push origin HEAD:feat/v17-p3b-python-structural-probe
