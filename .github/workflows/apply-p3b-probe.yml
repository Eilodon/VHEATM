name: Clean P3-B structural probe staging

on:
  push:
    branches:
      - feat/v17-p3b-python-structural-probe
    paths:
      - .github/workflows/apply-p3b-probe.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v17-p3b-python-structural-probe
          fetch-depth: 0
      - name: Remove patch staging
        run: |
          rm -f .github/p3b.patch.gz.b64.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github
          git commit -m "chore: clean P3-B patch staging"
          git push origin HEAD:feat/v17-p3b-python-structural-probe
