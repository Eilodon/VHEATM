name: Clean P3-A guarded broker staging

on:
  push:
    branches:
      - feat/v17-p3a-guarded-tool-broker
    paths:
      - .github/workflows/apply-p3a-broker.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v17-p3a-guarded-tool-broker
          fetch-depth: 0
      - name: Remove patch staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/p3a-patch.part-*
          git commit -m "chore: remove P3-A patch staging"
          git push origin HEAD:feat/v17-p3a-guarded-tool-broker
