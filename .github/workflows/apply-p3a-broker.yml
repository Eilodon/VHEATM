name: Apply P3-A guarded broker patch

on:
  push:
    branches:
      - feat/v17-p3a-guarded-tool-broker
    paths:
      - .github/p3a-patch.part-*
      - .github/workflows/apply-p3a-broker.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v17-p3a-guarded-tool-broker
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply validated patch
        run: |
          cat .github/p3a-patch.part-* > /tmp/p3a.patch
          git apply --check /tmp/p3a.patch
          git apply /tmp/p3a.patch
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate focused broker slice
        run: |
          python -m compileall -q src
          pytest -q tests/test_tool_broker.py
      - name: Commit guarded broker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tool-broker.md pyproject.toml src/vheatm_control/tool_broker.py tests/test_tool_broker.py
          git commit -m "feat: add guarded tool broker"
          git push origin HEAD:feat/v17-p3a-guarded-tool-broker
