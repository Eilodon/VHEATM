name: Apply P2-C.1 registry integrity patch

on:
  push:
    branches:
      - feat/v17-p2c1-registry-integrity
    paths:
      - .github/p2c1-registry-integrity.patch
      - .github/workflows/apply-p2c1-registry-integrity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v17-p2c1-registry-integrity
          fetch-depth: 0
      - name: Apply validated patch
        run: |
          git apply --check .github/p2c1-registry-integrity.patch
          git apply .github/p2c1-registry-integrity.patch
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/module-system.md src/vheatm_control/module_router.py tests/test_registry_integrity.py
          git commit -m "feat: harden module registry integrity"
          git push origin HEAD:feat/v17-p2c1-registry-integrity
