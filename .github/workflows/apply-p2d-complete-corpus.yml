name: Clean P2-D patch staging

on:
  push:
    branches:
      - feat/v17-p2d-complete-corpus
    paths:
      - .github/workflows/apply-p2d-complete-corpus.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v17-p2d-complete-corpus
          fetch-depth: 0
      - name: Remove remaining staging chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/p2d-patch.part-* || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove P2-D patch staging"
          git push origin HEAD:feat/v17-p2d-complete-corpus
