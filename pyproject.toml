[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vheatm-control"
version = "0.1.0"
description = "Machine-validated control plane for the VHEATM audit framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "referencing>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
vheatm-validate = "vheatm_control.validator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
